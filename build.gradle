plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Official Modrinth Maven: compile against Punchy without shipping or committing its jar.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elysium-visuals" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests (src/gametest): `gradlew runClientGameTest` opens the ClickGUI
// in a test world and saves screenshots to build/run/clientGameTest/screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elysium-visuals-test"
		enableGameTests = false
		eula = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Punchy! is optional at runtime (the launcher installs it); only compiled against.
	compileOnly "maven.modrinth:punchy-fpa:${project.punchy_version}"
	// Client game tests run with Punchy; `-PnoPunchy` checks the game without it.
	if (!project.hasProperty("noPunchy")) {
		gametestRuntimeOnly "maven.modrinth:punchy-fpa:${project.punchy_version}"
	}

	// Sodium is optional: compiled against for the compat mixins; `-Psodium` runs the game tests with it.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	if (project.hasProperty("sodium")) {
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Автокопирование готового jar в папку mods лаунчера Elysium после сборки.
// Старые jar этого мода удаляются, чтобы не было дублей. На CI (нет %APPDATA%) пропускается.
tasks.register('deployMod') {
	def jarTask = tasks.named('jar')
	def jarFile = jarTask.flatMap { it.archiveFile }
	def appData = System.getenv('APPDATA')
	def modsPath = "${appData}/.elysium/mods"

	dependsOn jarTask

	onlyIf { appData != null }

	doLast {
		def modsDir = new File(modsPath)
		modsDir.mkdirs()

		// удаляем старые jar этого мода (fabric-api и другие моды не трогаем)
		def old = modsDir.listFiles()
		if (old != null) {
			for (File f : old) {
				if (f.name.startsWith('elysium-visuals') && f.name.endsWith('.jar')) {
					f.delete()
				}
			}
		}

		// кладём свежий
		def src = jarFile.get().asFile
		java.nio.file.Files.copy(
				src.toPath(),
				new File(modsDir, src.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		println "Deployed ${src.name} -> ${modsDir}"
	}
}

tasks.named('build') {
	finalizedBy 'deployMod'
}